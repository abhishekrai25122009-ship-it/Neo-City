<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="favSkyline" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Cyber Octagon Base Shield -->
  <polygon points="50,4 88,20 96,50 88,80 50,96 12,80 4,50 12,20" fill="#050a14" stroke="url(#favShield)" stroke-width="4.5" stroke-linejoin="round" />

  <!-- Futuristic Skyline Spire & Arcology -->
  <rect x="24" y="52" width="10" height="26" fill="url(#favSkyline)" rx="1" />
  <polygon points="24,52 29,45 34,52" fill="#00e5a3" />

  <polygon points="36,78 36,42 42,37 44,37 44,78" fill="url(#favSkyline)" />

  <polygon points="46,78 46,26 50,12 54,26 54,78" fill="url(#favSkyline)" />
  <line x1="50" y1="12" x2="50" y2="78" stroke="#ffffff" stroke-width="1.8" />

  <polygon points="56,78 56,38 64,42 64,78" fill="url(#favSkyline)" />
  <circle cx="60" cy="48" r="3" fill="#ec4899" />

  <rect x="66" y="52" width="10" height="26" fill="url(#favSkyline)" rx="1" />
  <polygon points="66,52 71,45 76,52" fill="#8b5cf6" />

  <!-- High-Altitude Skybridge -->
  <path d="M 28 58 Q 50 49 72 58" fill="none" stroke="#00f0ff" stroke-width="3" />

  <!-- Radiant Core -->
  <circle cx="50" cy="78" r="8" fill="#050a14" stroke="url(#favShield)" stroke-width="3" />
  <circle cx="50" cy="78" r="3.5" fill="#00f0ff" />
</svg>
